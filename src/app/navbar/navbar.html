<header class="navbar">
  <nav class="inner" aria-label="Main navigation">
    <a class="brand" routerLink="/" aria-label="Angular Concepts, home">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 223 236">
          <defs>
            <linearGradient id="navbar-logo-gradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#ff3d5a" />
              <stop offset=".55" stop-color="#e535ab" />
              <stop offset="1" stop-color="#7702ff" />
            </linearGradient>
          </defs>
          <path fill="url(#navbar-logo-gradient)"
            d="M222.077 39.192l-8.019 125.923L137.387 0l84.69 39.192Zm-53.105 162.825-57.933 33.056-57.934-33.056 11.783-28.556h92.301l11.783 28.556ZM111.039 62.675l30.357 73.803H80.681l30.358-73.803ZM7.937 165.115 0 39.192 84.69 0 7.937 165.115Z" />
        </svg>
      </span>
      <span class="brand-text">Angular <span>Concepts</span></span>
    </a>

    <ul class="links">
      @for (link of links; track link.path) {
        <li>
          <a class="link" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }" [attr.aria-label]="link.full">
            <span class="active-dot" aria-hidden="true"></span>
            <span class="label-full">{{ link.full }}</span>
            <span class="label-short" aria-hidden="true">{{ link.short }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
